# docker-compose.yml → FINAL PRODUCTION STACK (NO KEYCLOAK)
version: '3.8'

services:
  # YOUR NESTJS BACKEND
  backend:
    build: .
    container_name: tasker-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mongodb://mongo:27017/tasker
      - JWT_SECRET=tasker-ethiopia-2025-super-secret
      # CLOUDINARY (FILE UPLOAD)
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      # SUPABASE (AUTH)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    volumes:
      - ./bpmn:/app/bpmn:ro           # Camunda workflows (optional)
    depends_on:
      - mongo
    networks:
      - tasker-net

  # MONGODB
  mongo:
    image: mongo:7
    container_name: tasker-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - tasker-net

volumes:
  mongo_data:

networks:
  tasker-net:
    driver: bridge